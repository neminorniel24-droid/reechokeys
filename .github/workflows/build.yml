name: Build ReechoKeys

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconsole --noconfirm --icon icon.ico --add-data "icon.ico;." --collect-all customtkinter --name ReechoKeys reechokeys.py
      - run: choco install innosetup -y --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: ReechoKeys-Windows
          path: installer/ReechoKeys-Setup.exe

  # macOS and Linux are experimental: a failure there must not block the Windows release
  macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --windowed --noconfirm --icon icon.icns --add-data "icon.ico:." --collect-all customtkinter --hidden-import pynput.keyboard._darwin --hidden-import pynput.mouse._darwin --name ReechoKeys reechokeys.py
      - run: ditto -c -k --sequesterRsrc --keepParent dist/ReechoKeys.app ReechoKeys-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ReechoKeys-macOS
          path: ReechoKeys-macOS.zip

  linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: pip install -r requirements.txt pyinstaller
      - run: xvfb-run -a pyinstaller --noconfirm --add-data "icon.ico:." --collect-all customtkinter --hidden-import pynput.keyboard._xorg --hidden-import pynput.mouse._xorg --name ReechoKeys reechokeys.py
      - run: tar -czf ReechoKeys-Linux.tar.gz -C dist ReechoKeys
      - uses: actions/upload-artifact@v4
        with:
          name: ReechoKeys-Linux
          path: ReechoKeys-Linux.tar.gz

  release:
    needs: [windows, macos, linux]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
